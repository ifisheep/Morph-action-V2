name: cpu-check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and CPU dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check morphdream scripts tests
      - name: Check import boundaries
        run: lint-imports
      - name: Test CPU suite
        run: python -m pytest -m 'not gpu'
