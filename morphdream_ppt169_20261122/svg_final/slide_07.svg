<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background"/><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">相关工作</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">最接近的工作仍把形态当作运动或姿态工具</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">07</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="148" width="1124" height="60" rx="8" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="216.0" y="175" font-family="Source Han Sans SC" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">工作</text><text x="561.0" y="175" font-family="Source Han Sans SC" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">它做了什么</text><text x="983.0" y="175" font-family="Source Han Sans SC" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">我们的区别</text><rect x="76" y="208" width="1124" height="60" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="235" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">Daudelin 等，Science Robotics 2018</text><text x="366" y="235" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">先感知环境，再选构型执行任务</text><text x="776" y="235" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">为获取证据而变形，并计入机动性代价</text><rect x="76" y="268" width="1124" height="60" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="295" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">Learning to Reconfigure，ICML 2026</text><text x="366" y="295" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">为跨越地形而切换，只看本体状态</text><text x="776" y="295" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">由视觉证据触发切换</text><rect x="76" y="328" width="1124" height="60" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="355" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">POSE，2026 预印本</text><text x="366" y="355" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">调节俯仰、横滚扩大覆盖</text><text x="776" y="355" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">改变接触模式和可达动作</text><rect x="76" y="388" width="1124" height="60" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="415" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">VRW，2026 预印本</text><text x="366" y="415" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">设计期提出可见—可达指标</text><text x="776" y="415" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">任务进行中的在线选择</text><rect x="76" y="448" width="1124" height="60" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="475" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">EMOS，ICLR 2025</text><text x="366" y="475" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">在多台机器人间分配任务</text><text x="776" y="475" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">在一台机器人的多种形态间选择</text><rect x="76" y="508" width="1124" height="60" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="535" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">Pathak 2019 / DittoGym 2024</text><text x="366" y="535" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">任务中在线改变形态</text><text x="776" y="535" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#253143" text-anchor="start">目标是运动，本文目标是感知证据</text><rect x="76" y="590" width="102" height="26" rx="13" fill="#EEF3FB" stroke="none" stroke-width="1"/><text x="88" y="608" font-family="Source Han Sans SC" font-size="13" font-weight="bold" fill="#1F4E9A" text-anchor="start">审稿人问题</text><text x="190" y="610" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">Daudelin 已做过感知驱动重构，POSE 也用姿态做感知。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1"/><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">07 / 24</text></svg>