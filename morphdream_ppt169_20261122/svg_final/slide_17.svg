被家具挡住</text><rect x="754" y="405" width="202" height="142" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><circle cx="855" cy="448" r="25" fill="#EEF3FB" stroke="#1F4E9A" stroke-width="1" /><text x="855" y="455" font-family="Inter" font-size="16" font-weight="bold" fill="#1F4E9A" text-anchor="middle">4</text><text x="855" y="496" font-family="Source Han Sans SC" font-size="15" font-weight="bold" fill="#253143" text-anchor="middle">柜内低层</text><text x="855" y="521" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#667085" text-anchor="middle">开放格内部</text><rect x="980" y="405" width="202" height="142" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><circle cx="1081" cy="448" r="25" fill="#EEF3FB" stroke="#1F4E9A" stroke-width="1" /><text x="1081" y="455" font-family="Inter" font-size="16" font-weight="bold" fill="#1F4E9A" text-anchor="middle">5</text><text x="1081" y="496" font-family="Source Han Sans SC" font-size="15" font-weight="bold" fill="#253143" text-anchor="middle">远处小目标</text><text x="1081" y="521" font-family="Source Han Sans SC" font-size="13" font-weight="normal" fill="#667085" text-anchor="middle">远距离小物体</text><text x="76" y="594" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#1F4E9A" text-anchor="start">每类藏匿位置都应有一种形态是唯一高效的观察方式。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1" /><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">17 / 24</text></svg>