<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A" /></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background" /><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">决策策略</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">自适应贪心给出决策骨架，切换代价留下理论空间</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">15</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1" /><rect x="76" y="154" width="480" height="382" rx="16" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="106" y="190" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#253143" text-anchor="start">每步重新决策</text><circle cx="135" cy="245" r="20" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="135" y="251" font-family="Inter" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="174" y="241" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#1F4E9A" text-anchor="start">提议</text><text x="174" y="269" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start">4–8 个候选</text><line x1="135" y1="265" x2="135" y2="310" stroke="#1F4E9A" stroke-width="2" marker-end="url(#arrow)" /><circle cx="135" cy="330" r="20" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="135" y="336" font-family="Inter" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="174" y="326" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#1F4E9A" text-anchor="start">想象</text><text x="174" y="354" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start">只在形态切换时两步前瞻</text><line x1="135" y1="350" x2="135" y2="395" stroke="#1F4E9A" stroke-width="2" marker-end="url(#arrow)" /><circle cx="135" cy="415" r="20" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="135" y="421" font-family="Inter" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="174" y="411" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#1F4E9A" text-anchor="start">择优</text><text x="174" y="439" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start">按证据增益减代价</text><rect x="618" y="154" width="586" height="164" rx="16" fill="#EEF3FB" stroke="none" stroke-width="1" /><text x="650" y="190" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#1F4E9A" text-anchor="start">理论依据</text><text fill="#253143" font-size="18" font-family="Source Han Sans SC" text-anchor="start" font-weight="bold" x="650" y="228">自适应次模性下，自适应贪心接近最优。</text><text fill="#253143" font-size="18" font-family="Source Han Sans SC" text-anchor="start" font-weight="bold" x="650" y="254.1">切换代价会破坏这一保证，留下理论切入点。</text><text x="650" y="286" font-family="Inter" font-size="13" font-weight="normal" fill="#667085" text-anchor="start">Golovin &amp; Krause, JAIR 2011</text><rect x="618" y="340" width="586" height="196" rx="16" fill="#EEF2F7" stroke="none" stroke-width="1" /><text x="650" y="376" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">自适应计算分配</text><text x="650" y="414" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#253143" text-anchor="start">候选越接近、切换代价越大，就想得越多。</text><line x1="650" y1="478" x2="1136" y2="478" stroke="#A8B0BA" stroke-width="2" /><line x1="650" y1="478" x2="650" y2="424" stroke="#1F4E9A" stroke-width="4" /><line x1="890" y1="478" x2="890" y2="450" stroke="#1F4E9A" stroke-width="4" /><line x1="1136" y1="478" x2="1136" y2="390" stroke="#1F4E9A" stroke-width="4" /><text x="650" y="508" font-family="Source Han Sans SC" font-size="12" font-weight="normal" fill="#667085" text-anchor="start">候选差距大</text><text x="1136" y="508" font-family="Source Han Sans SC" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="end">变形之前多想想</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1" /><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">15 / 24</text></svg>