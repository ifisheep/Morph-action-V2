<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A" /></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background" /><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">问题定义</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">机器人需要把变形当作感知决策</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">03</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1" /><rect x="76" y="130" width="104" height="26" rx="13" fill="#EEF3FB" stroke="none" stroke-width="1" /><text x="88" y="148" font-family="Source Han Sans SC" font-size="13" font-weight="bold" fill="#1F4E9A" text-anchor="start">三个子问题</text><rect x="76" y="205" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><circle cx="110" cy="236" r="19" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="110" y="242" font-family="Inter" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text><text x="150" y="243" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#253143" text-anchor="start">用哪种形态去感知？</text><rect x="76" y="289" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><circle cx="110" cy="320" r="19" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="110" y="326" font-family="Inter" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text><text x="150" y="327" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#253143" text-anchor="start">每种形态怎么感知？</text><rect x="76" y="373" width="360" height="62" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><circle cx="110" cy="404" r="19" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="110" y="410" font-family="Inter" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">03</text><text x="150" y="411" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#253143" text-anchor="start">何时变形、怎么变过去？</text><rect x="500" y="150" width="704" height="220" rx="18" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="536" y="194" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#DCE7F8" text-anchor="start">核心主张</text><text fill="#FFFFFF" font-size="23" font-family="Source Han Sans SC" text-anchor="start" font-weight="bold" x="536" y="246">重构身体是一种信息采集动作。</text><text fill="#FFFFFF" font-size="23" font-family="Source Han Sans SC" text-anchor="start" font-weight="bold" x="536" y="278.66">它抬高的是“能获得哪些证据”的上限。</text><text fill="#FFFFFF" font-size="23" font-family="Source Han Sans SC" text-anchor="start" font-weight="bold" x="536" y="311.32">更多思考和更好视点规划都无法替代这一上限。</text><rect x="500" y="420" width="160" height="118" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="516" y="454" font-family="Inter" font-size="14" font-weight="bold" fill="#1F4E9A" text-anchor="start">C1</text><text x="516" y="480" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">存在性</text><text fill="#667085" font-size="13" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="516" y="507">变形扩展可见集合</text><rect x="676" y="420" width="160" height="118" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="692" y="454" font-family="Inter" font-size="14" font-weight="bold" fill="#1F4E9A" text-anchor="start">C2</text><text x="692" y="480" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">归因</text><text fill="#667085" font-size="13" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="692" y="507">区分位姿受限与身体受限</text><rect x="852" y="420" width="160" height="118" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="868" y="454" font-family="Inter" font-size="14" font-weight="bold" fill="#1F4E9A" text-anchor="start">C3</text><text x="868" y="480" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">决策</text><text fill="#667085" font-size="13" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="868" y="507">知道何时变、变成什么、何时不变</text><rect x="1028" y="420" width="160" height="118" rx="12" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><text x="1044" y="454" font-family="Inter" font-size="14" font-weight="bold" fill="#1F4E9A" text-anchor="start">C4</text><text x="1044" y="480" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">物理</text><text fill="#667085" font-size="13" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="1044" y="507">代价与稳定性来自实测</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1" /><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">03 / 24</text></svg>