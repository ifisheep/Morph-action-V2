<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A" /></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA" /></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background" /><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1" /><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">挑战</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">真正的难点是判断何时换、换成什么、值不值得</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">05</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1" /><rect x="76" y="150" width="344" height="170" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><rect x="76" y="150" width="6" height="170" rx="3" fill="#A8B0BA" stroke="none" stroke-width="1" /><circle cx="104" cy="177" r="13" fill="#EEF2F7" stroke="#A8B0BA" stroke-width="1" /><text x="104" y="182" font-family="Inter" font-size="12" font-weight="bold" fill="#A8B0BA" text-anchor="middle">01</text><text x="128" y="180" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">代价地形随身体改变</text><text fill="#667085" font-size="14" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="128" y="208">可达性、成像质量和代价同时变化</text><rect x="454" y="150" width="344" height="170" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><rect x="454" y="150" width="6" height="170" rx="3" fill="#A8B0BA" stroke="none" stroke-width="1" /><circle cx="482" cy="177" r="13" fill="#EEF2F7" stroke="#A8B0BA" stroke-width="1" /><text x="482" y="182" font-family="Inter" font-size="12" font-weight="bold" fill="#A8B0BA" text-anchor="middle">02</text><text x="506" y="180" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">回报取决于信念且边际递减</text><text fill="#667085" font-size="14" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="506" y="208">看过的地方不再提供新信息</text><rect x="832" y="150" width="344" height="170" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><rect x="832" y="150" width="6" height="170" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1" /><circle cx="860" cy="177" r="13" fill="#EEF3FB" stroke="#1F4E9A" stroke-width="1" /><text x="860" y="182" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="middle">03</text><text x="884" y="180" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">能力耦合</text><text fill="#667085" font-size="14" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="884" y="208">P(m) ⊂ P，视点变多也可能动作变少</text><rect x="76" y="364" width="344" height="170" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><rect x="76" y="364" width="6" height="170" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1" /><circle cx="104" cy="391" r="13" fill="#EEF3FB" stroke="#1F4E9A" stroke-width="1" /><text x="104" y="396" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="middle">04</text><text x="128" y="394" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">变形有真实代价</text><text fill="#667085" font-size="14" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="128" y="422">耗时、跌倒、过渡失败，系统要会不变形</text><rect x="454" y="364" width="344" height="170" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><rect x="454" y="364" width="6" height="170" rx="3" fill="#A8B0BA" stroke="none" stroke-width="1" /><circle cx="482" cy="391" r="13" fill="#EEF2F7" stroke="#A8B0BA" stroke-width="1" /><text x="482" y="396" font-family="Inter" font-size="12" font-weight="bold" fill="#A8B0BA" text-anchor="middle">05</text><text x="506" y="394" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">感知运动协调不同</text><text fill="#667085" font-size="14" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="506" y="422">稳像、步态相位与自遮挡随形态变化</text><rect x="832" y="364" width="344" height="170" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1" /><rect x="832" y="364" width="6" height="170" rx="3" fill="#A8B0BA" stroke="none" stroke-width="1" /><circle cx="860" cy="391" r="13" fill="#EEF2F7" stroke="#A8B0BA" stroke-width="1" /><text x="860" y="396" font-family="Inter" font-size="12" font-weight="bold" fill="#A8B0BA" text-anchor="middle">06</text><text x="884" y="394" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#253143" text-anchor="start">新形态要即插即用</text><text fill="#667085" font-size="14" font-family="Source Han Sans SC" text-anchor="start" font-weight="normal" x="884" y="422">新增形态不能要求重新训练</text><rect x="76" y="576" width="78" height="26" rx="13" fill="#EEF3FB" stroke="none" stroke-width="1" /><text x="88" y="594" font-family="Source Han Sans SC" font-size="13" font-weight="bold" fill="#1F4E9A" text-anchor="start">护城河</text><text x="168" y="596" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#253143" text-anchor="start">能力耦合  ·  真实代价  ·  会选择不变形</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1" /><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">05 / 24</text></svg>