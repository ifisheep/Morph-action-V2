<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background"/><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">相关工作</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">多项研究把瓶颈指向身体带来的观测限制</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">04</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="152" width="532" height="178" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="152" width="6" height="178" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><circle cx="104" cy="179" r="13" fill="#EEF3FB" stroke="#1F4E9A" stroke-width="1"/><text x="104" y="184" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="middle">12%</text><text x="128" y="182" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#253143" text-anchor="start">TVRBench</text><text x="128" y="210" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start"><tspan x="128" dy="0">2026 预印本</tspan><tspan x="128" dy="19.32">只转头时尚可；需要移动身体时显著下降</tspan><tspan x="128" dy="19.32">最好闭源模型成功率只有 12%</tspan></text><rect x="640" y="152" width="532" height="178" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/><rect x="640" y="152" width="6" height="178" rx="3" fill="#A8B0BA" stroke="none" stroke-width="1"/><circle cx="668" cy="179" r="13" fill="#EEF2F7" stroke="#A8B0BA" stroke-width="1"/><text x="668" y="184" font-family="Inter" font-size="12" font-weight="bold" fill="#A8B0BA" text-anchor="middle">缺失</text><text x="692" y="182" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#253143" text-anchor="start">PhysVLM-AVR / Theory of Space</text><text x="692" y="210" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start"><tspan x="692" dy="0">NeurIPS 2025 · ICLR 2026</tspan><tspan x="692" dy="19.32">模型能察觉信息缺失，却难主动获取</tspan><tspan x="692" dy="19.32">自行探索反而比直接给观测更差</tspan></text><rect x="76" y="362" width="532" height="178" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="362" width="6" height="178" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><circle cx="104" cy="389" r="13" fill="#EEF3FB" stroke="#1F4E9A" stroke-width="1"/><text x="104" y="394" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="middle">跨具身</text><text x="128" y="392" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#253143" text-anchor="start">VLN-PE</text><text x="128" y="420" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start"><tspan x="128" dy="0">ICCV 2025</tspan><tspan x="128" dy="19.32">同一导航模型跨人形、四足、轮式性能下降</tspan><tspan x="128" dy="19.32">受限观测空间是原因之一</tspan></text><rect x="640" y="362" width="532" height="178" rx="14" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/><rect x="640" y="362" width="6" height="178" rx="3" fill="#A8B0BA" stroke="none" stroke-width="1"/><circle cx="668" cy="389" r="13" fill="#EEF2F7" stroke="#A8B0BA" stroke-width="1"/><text x="668" y="394" font-family="Inter" font-size="12" font-weight="bold" fill="#A8B0BA" text-anchor="middle">高度</text><text x="692" y="392" font-family="Source Han Sans SC" font-size="17" font-weight="bold" fill="#253143" text-anchor="start">相机高度研究</text><text x="692" y="420" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start"><tspan x="692" dy="0">2020</tspan><tspan x="692" dy="19.32">高相机整体视野更好</tspan><tspan x="692" dy="19.32">地面柜内目标由低相机更有利</tspan></text><text x="76" y="602" font-family="Source Han Sans SC" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="start">共同指向</text><text x="170" y="602" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#253143" text-anchor="start">观测空间由身体决定，现有模型很难跨越这一限制。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1"/><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">04 / 24</text></svg>