<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background"/><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">基线设计</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">基线覆盖身体约束、姿态调节和想象替代等解释</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">18</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="148" width="1204" height="48" rx="8" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="291.0" y="175" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">基线</text><text x="893.0" y="175" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">回答的质疑</text><rect x="76" y="196" width="1204" height="48" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="223" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">最佳固定形态</text><text x="516" y="223" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">重构是否必要</text><rect x="76" y="244" width="1204" height="48" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="271" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">固定形态 + 连续姿态与注视（强基线）</text><text x="516" y="271" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">姿态调节是否就够了</text><rect x="76" y="292" width="1204" height="48" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="319" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">固定升级规则：视点 → 注意力 → 形态</text><text x="516" y="319" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">证据增益决定何时变形是否更好</text><rect x="76" y="340" width="1204" height="48" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="367" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">纯思维链智能体</text><text x="516" y="367" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">几何想象是否必要</text><rect x="76" y="388" width="1204" height="48" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="415" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">VLFM 式语义前沿探索</text><text x="516" y="415" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">与现有语义搜索相比如何</text><rect x="76" y="436" width="1204" height="48" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="463" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">只想象、不变形</text><text x="516" y="463" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">想象能否替代真实变形</text><rect x="76" y="484" width="1204" height="48" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="511" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">自由相机（上界）</text><text x="516" y="511" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">是否只是换了个更高的相机</text><rect x="76" y="532" width="1204" height="48" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="559" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">理想形态选择（上界）</text><text x="516" y="559" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">离最优还有多远</text><rect x="76" y="580" width="1204" height="48" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="607" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">训练版评估器</text><text x="516" y="607" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">免训练能否追平训练</text><text x="76" y="620" font-family="Source Han Sans SC" font-size="15" font-weight="normal" fill="#667085" text-anchor="start">两个上界行用来标定取舍，不替代真实身体约束下的决策。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1"/><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">18 / 24</text></svg>