<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background"/><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">系统分工</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">大模型提议语义动作，几何模块验证最终选择</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">16</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="150" width="1128" height="58" rx="8" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="201.0" y="177" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">模块</text><text x="765.0" y="177" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">实现</text><rect x="76" y="208" width="1128" height="58" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="235" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">证据需求解析</text><text x="336" y="235" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">开源大语言模型</text><rect x="76" y="266" width="1128" height="58" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="293" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">瓶颈诊断</text><text x="336" y="293" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">视觉语言模型给语义线索，几何计算判断可见性与可达性</text><rect x="76" y="324" width="1128" height="58" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="351" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">动作提议</text><text x="336" y="351" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">视觉语言模型做结构化思维链，输入记忆摘要与遮罩</text><rect x="76" y="382" width="1128" height="58" rx="0" fill="#EEF3FB" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="409" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#253143" text-anchor="start">证据增益评估</text><text x="336" y="409" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#253143" text-anchor="start">几何想象、结构先验和履历，不用大模型</text><rect x="76" y="440" width="1128" height="58" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="467" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">执行验证</text><text x="336" y="467" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">仿真真值加噪声；开放词汇检测器或视觉语言模型</text><rect x="76" y="498" width="1128" height="58" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="525" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">情景记忆（可选）</text><text x="336" y="525" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">借鉴 Reflexion，把失败反馈写成文字经验</text><rect x="76" y="588" width="1128" height="54" rx="12" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="640" y="621" font-family="Source Han Sans SC" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">原则：大模型不进入控制回路，也不独自做最终决策。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1"/><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">16 / 24</text></svg>