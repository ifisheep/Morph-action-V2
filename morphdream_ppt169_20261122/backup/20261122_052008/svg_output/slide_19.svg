<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background"/><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">实验计划</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">五组实验将四个科学主张映射到可检验指标</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">19</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="145" width="686" height="42" rx="8" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="186.0" y="172" font-family="Source Han Sans SC" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">实验</text><text x="456.0" y="172" font-family="Source Han Sans SC" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">内容</text><text x="689.0" y="172" font-family="Source Han Sans SC" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">对应主张</text><rect x="76" y="187" width="686" height="42" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="214" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">E1 主对比</text><text x="306" y="214" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">全部藏匿类型上