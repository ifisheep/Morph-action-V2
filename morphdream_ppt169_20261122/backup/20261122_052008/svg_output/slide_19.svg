" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">去掉诊断、结构先验、两步前瞻、梦醒分离</text><text x="689.0" y="382" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="middle">C2、C3</text><rect x="76" y="397" width="686" height="42" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="424" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">诊断准确率</text><text x="306" y="424" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">位姿受限 vs 身体受限</text><text x="689.0" y="424" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="middle">C2</text><rect x="76" y="439" width="686" height="42" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="466" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">物理有效性</text><text x="306" y="466" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="start">实测履历、跌倒率、过渡成功率</text><text x="689.0" y="466" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#253143" text-anchor="middle">C4</text><rect x="820" y="503" width="360" height="145" rx="10" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="1"/><text x="838" y="525" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#D94343" text-anchor="start">预期结果（示意）</text><line x1="862" y1="628" x2="862" y2="545" stroke="#A8B0BA" stroke-width="1"/><line x1="862" y1="628" x2="1158" y2="628" stroke="#A8B0BA" stroke-width="1"/><path d="M 862 600 C 940 600, 980 598, 1158 600" fill="none" stroke="#A8B0BA" stroke-width="2"/><path d="M 862 582 C 940 586, 1010 582, 1158 583" fill="none" stroke="#8FB2E6" stroke-width="2"/><path d="M 862 566 C 940 578, 1010 606, 1158 616" fill="none" stroke="#1F4E9A" stroke-width="3"/><text x="874" y="644" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">固定</text><text x="965" y="644" font-family="Source Han Sans SC" font-size="11" font-weight="normal" fill="#5D7FAE" text-anchor="start">固定+姿态</text><text x="1070" y="644" font-family="Source Han Sans SC" font-size="11" font-weight="bold" fill="#1F4E9A" text-anchor="start">可重构（本项目）</text><text x="76" y="654" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#667085" text-anchor="start">指标：成功率、获得证据用时（含思考）、切换次数、跌倒率、过渡失败率，至少 8 个随机种子。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1"/><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">19 / 24</text></svg>