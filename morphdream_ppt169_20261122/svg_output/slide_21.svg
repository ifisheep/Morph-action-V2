<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Source Han Sans SC"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#1F4E9A"/></marker><marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0,0 10,5 0,10" fill="#A8B0BA"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F8FAFC" stroke="none" stroke-width="1" id="background"/><rect x="52" y="38" width="7" height="54" rx="3" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="76" y="57" font-family="Inter" font-size="12" font-weight="bold" fill="#1F4E9A" text-anchor="start">风险与对策</text><text x="76" y="91" font-family="Source Han Sans SC" font-size="29" font-weight="bold" fill="#253143" text-anchor="start">每项主要风险都有对应的降级路径</text><text x="1218" y="61" font-family="Inter" font-size="15" font-weight="bold" fill="#1F4E9A" text-anchor="end">21</text><line x1="76" y1="112" x2="1204" y2="112" stroke="#D6DCE5" stroke-width="1"/><rect x="76" y="150" width="1224" height="64" rx="8" fill="#1F4E9A" stroke="none" stroke-width="1"/><text x="276.0" y="177" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">风险</text><text x="888.0" y="177" font-family="Source Han Sans SC" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">对策</text><rect x="76" y="214" width="1224" height="64" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="241" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">距截稿只有约 9 周</text><text x="486" y="241" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">先用三种形态跑通全流程，再补齐其余形态</text><rect x="76" y="278" width="1224" height="64" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="305" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">多形态底层实现量大</text><text x="486" y="305" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">经典步态加感知调制，不做端到端运动学习</text><rect x="76" y="342" width="1224" height="64" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="369" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">想象在未知区域不准</text><text x="486" y="369" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">结构先验加保守打分；生成式想象只用于复核</text><rect x="76" y="406" width="1224" height="64" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="433" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">收益被连续姿态调节抵消</text><text x="486" y="433" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">设为强基线；转为刻画何时重构值得</text><rect x="76" y="470" width="1224" height="64" rx="0" fill="#FFFFFF" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="497" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">提示词与参数过拟合开发场景</text><text x="486" y="497" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">严格数据划分，提前冻结提示词</text><rect x="76" y="534" width="1224" height="64" rx="0" fill="#EEF2F7" stroke="#D6DCE5" stroke-width="0.6"/><text x="86" y="561" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">大模型推理延迟</text><text x="486" y="561" font-family="Source Han Sans SC" font-size="14" font-weight="normal" fill="#253143" text-anchor="start">低频调用、缓存，并把思考时间计入耗时</text><text x="76" y="630" font-family="Source Han Sans SC" font-size="16" font-weight="bold" fill="#1F4E9A" text-anchor="start">即使收益有限，“何时重构值得”本身也是可交付结论。</text><line x1="76" y1="684" x2="1204" y2="684" stroke="#D6DCE5" stroke-width="1"/><text x="76" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="start">MorphAction · Protean Perception</text><text x="1204" y="705" font-family="Inter" font-size="11" font-weight="normal" fill="#667085" text-anchor="end">21 / 24</text></svg>